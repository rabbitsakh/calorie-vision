<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Android — та же вёрстка и очередь</title>
  <link rel="stylesheet" href="../screens.css" />
</head>
<body>
  <div class="phone">
    <div class="notif">
      <div class="app">CV</div>
      <div>
        <b>1 черновик на устройстве</b>
        <span>Откройте приложение — отправим при связи</span>
      </div>
    </div>
    <header class="top"><h1>Сегодня</h1></header>
    <p class="date">воскресенье, 22 ноября</p>
    <div class="scroll">
      <section class="chest-dock ready">
        <div class="dock-main">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <rect x="6" y="14" width="24" height="16" rx="3" fill="#0d7377" stroke="#134e4a" stroke-width="1.4"/>
            <rect x="8" y="8" width="20" height="8" rx="2" fill="#14b8a6" stroke="#134e4a" stroke-width="1.3"/>
            <circle cx="18" cy="20" r="2.2" fill="#fde68a"/>
          </svg>
          <div style="flex:1">
            <p class="dock-label">Сундук готов</p>
            <p class="dock-detail">Открой — награда в коллекцию</p>
            <p class="dock-meta">Открытие в очереди — уйдёт при связи</p>
          </div>
          <button class="dock-cta" type="button">Открыть</button>
        </div>
      </section>
      <article class="meal">
        <div><span>Обед · с телефона</span><b>Ждёт отправку вместе с сундуком</b></div>
        <em>…</em>
      </article>
    </div>
    <nav class="tabs">
      <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>Сегодня</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 16c2-4 4-8 6-8s2 6 4 8"/></svg>Зал</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16l5-5 4 3 7-8"/></svg>Прогресс</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/></svg>Я</div>
    </nav>
  </div>
</body>
</html>
