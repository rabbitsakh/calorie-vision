<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Сундук получен</title>
  <link rel="stylesheet" href="../screens.css" />
  <link rel="stylesheet" href="rich.css" />
</head>
<body>
  <div class="phone">
    <header class="top"><h1>Сегодня</h1></header>
    <p class="date">воскресенье, 22 ноября</p>
    <div class="scroll">
      <section class="pantry hot">
        <p class="kicker">Можно открывать</p>
        <h2>Сундук твой</h2>
        <p class="rule">Сегодня ты и поел, и был в зале. Поэтому он поинтереснее обычного.</p>
        <div class="leaves">
          <div class="leaf-col"><div class="leaf gold"><svg width="36" height="36" viewBox="0 0 64 64"><path fill="#fff" d="M32 8c12 10 18 18 18 30a18 18 0 0 1-36 0c0-12 6-20 18-30z"/></svg></div><b>Пт</b><span>еда</span></div>
          <div class="leaf-col"><div class="leaf gold"><svg width="36" height="36" viewBox="0 0 64 64"><path fill="#fff" d="M32 8c12 10 18 18 18 30a18 18 0 0 1-36 0c0-12 6-20 18-30z"/></svg></div><b>Сб</b><span>зал</span></div>
          <div class="leaf-col"><div class="leaf gold"><svg width="36" height="36" viewBox="0 0 64 64"><path fill="#fff" d="M32 8c12 10 18 18 18 30a18 18 0 0 1-36 0c0-12 6-20 18-30z"/></svg></div><b>Вс</b><span>и то и другое</span></div>
        </div>
        <div class="chest-row" style="margin-top:14px">
          <div data-chest="rare" data-pose="shut" class="lg"></div>
          <p>Я уже держу крышку. Откроем?</p>
        </div>
        <button class="open-btn" type="button">Открыть</button>
        <img class="mascot" src="../../../public/mascot/art/autumn/cheer.webp" alt="" style="width:96px;height:96px;top:4px" />
      </section>
    </div>
    <nav class="tabs">
      <div class="tab on">Сегодня</div><div class="tab">Зал</div><div class="tab">Прогресс</div><div class="tab">Я</div>
    </nav>
  </div>
  <script src="chest.js"></script>
</body>
</html>
