<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Сундук получен</title>
  <link rel="stylesheet" href="../screens.css" />
  <link rel="stylesheet" href="rich.css" />
</head>
<body>
  <div class="phone">
    <header class="top"><h1>Сегодня</h1></header>
    <p class="date">воскресенье, 22 ноября · комбо</p>
    <div class="scroll">
      <section class="pantry hot">
        <p class="kicker">Три из трёх · редкий</p>
        <h2>Сундук готов</h2>
        <p class="rule">Еда и зал в один день. Откроется лаковый, не деревянный.</p>
        <div class="leaves">
          <div class="leaf-col"><div class="leaf gold"><svg width="36" height="36" viewBox="0 0 64 64"><path fill="#fff" d="M32 6C16 26 10 34 12 46c2 12 12 14 20 14s18-2 20-14c2-12-4-20-20-40z"/></svg></div><b>Пт</b><span>тарелка</span></div>
          <div class="leaf-col"><div class="leaf gold"><svg width="36" height="36" viewBox="0 0 64 64"><path fill="#fff" d="M32 6C16 26 10 34 12 46c2 12 12 14 20 14s18-2 20-14c2-12-4-20-20-40z"/></svg></div><b>Сб</b><span>зал</span></div>
          <div class="leaf-col"><div class="leaf gold"><svg width="36" height="36" viewBox="0 0 64 64"><path fill="#fff" d="M32 6C16 26 10 34 12 46c2 12 12 14 20 14s18-2 20-14c2-12-4-20-20-40z"/></svg></div><b>Вс</b><span>комбо</span></div>
        </div>
        <div class="chest-row" style="margin-top:14px">
          <div data-chest="rare" data-pose="shut" class="lg"></div>
          <p>Груша уже держит крышку. Редкий камень светится, потому что сегодня и тарелка, и зал.</p>
        </div>
        <button class="open-btn" type="button">Открыть сундук</button>
        <img class="mascot" src="../../../public/mascot/art/autumn/cheer.webp" alt="" style="width:96px;height:96px;top:4px" />
      </section>
    </div>
    <nav class="tabs">
      <div class="tab on">Сегодня</div><div class="tab">Зал</div><div class="tab">Прогресс</div><div class="tab">Я</div>
    </nav>
  </div>
  <script src="chest.js"></script>
</body>
</html>
