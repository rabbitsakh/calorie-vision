<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Коллекция наград</title>
  <link rel="stylesheet" href="../screens.css" />
</head>
<body>
  <div class="phone show">
    <header class="show-head">
      <h1>Кладовая</h1>
      <p>6 из 18 · одежда груши, темы и значки. Платного здесь нет.</p>
    </header>
    <div class="wear-row">
      <img src="../../../public/mascot/art/autumn/idle.webp" alt="" />
      <div>
        <b>Сейчас на груше</b>
        <span>Осенний шарф · золотой лист ещё не надет</span>
      </div>
    </div>
    <p class="section-label">Одежда</p>
    <div class="cards">
      <article class="card">
        <i>редк.</i>
        <img src="../../../public/mascot/art/autumn/idle.webp" alt="" />
        <b>Осенний шарф</b>
      </article>
      <article class="card">
        <i>редк.</i>
        <img src="../../../public/mascot/art/cheer.webp" alt="" />
        <b>Золотой лист</b>
      </article>
      <article class="card lock">
        <img src="../../../public/mascot/art/streak.webp" alt="" />
        <b>Повязка зала</b>
      </article>
    </div>
    <p class="section-label">Темы дня</p>
    <div class="cards">
      <article class="card"><div class="swatch"></div><b>Бирюза</b></article>
      <article class="card"><div class="swatch amber"></div><b>Янтарь</b></article>
      <article class="card lock"><div class="swatch mint"></div><b>Мята</b></article>
    </div>
    <p class="section-label">Серия «Живые дни» · 2 из 4</p>
    <div class="cards">
      <article class="card"><img src="../../../public/mascot/art/goal.webp" alt="" /><b>Первый день</b></article>
      <article class="card"><img src="../../../public/mascot/art/streak.webp" alt="" /><b>Комбо</b></article>
      <article class="card lock"><img src="../../../public/mascot/art/idle.webp" alt="" /><b>Неделя</b></article>
    </div>
  </div>
</body>
</html>
