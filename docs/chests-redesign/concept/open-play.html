<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Открытие — прототип</title>
  <link rel="stylesheet" href="../screens.css" />
  <link rel="stylesheet" href="rich.css" />
  <style>
    body.play { width: 390px; height: 844px; overflow: hidden; }
    #scene { position: relative; width: 390px; height: 844px; }
    #pear { position: absolute; left: 80px; top: 120px; width: 230px; height: 230px; object-fit: contain; transition: transform .4s ease; }
    #chest { position: absolute; left: 108px; top: 330px; }
    #card {
      position: absolute; left: 28px; top: 250px; opacity: 0; transform: translateY(28px) scale(.92);
      transition: opacity .45s ease, transform .45s cubic-bezier(.2,1,.3,1);
    }
    #card.show { opacity: 1; transform: none; }
    #cap { position: absolute; left: 24px; right: 24px; bottom: 36px; text-align: center; }
    #cap h2 { margin: 0; font-family: Unbounded, sans-serif; font-size: 26px; }
    #cap p { margin: 6px 0 0; font-weight: 700; color: rgba(255,255,255,.82); }
    .burst { position: absolute; width: 16px; height: 20px; border-radius: 0 80% 0 80%; background: #86efac; left: 50%; top: 46%; opacity: 0; }
    .burst.g { background: #fbbf24; }
    #ring { position: absolute; left: 50%; top: 42%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid rgba(255,236,180,0); }
  </style>
</head>
<body class="stage rich play">
  <div id="scene">
    <div id="ring"></div>
    <img id="pear" src="../../../public/mascot/art/goal.webp" alt="" />
    <div id="chest" data-chest="rare" data-pose="shut" class="lg"></div>
    <div id="card" class="loot-card">
      <div class="sw"><svg width="36" height="36" viewBox="0 0 64 64"><path fill="#fff" d="M32 6C16 26 10 34 12 46c2 12 12 14 20 14s18-2 20-14c2-12-4-20-20-40z"/></svg></div>
      <p style="margin:8px 0 0;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7c4a03">Поинтереснее</p>
      <p style="margin:2px 0 0;font-family:Unbounded,sans-serif;font-weight:700;font-size:18px">Золотой лист</p>
    </div>
    <div id="cap"><h2 id="title">Я замерла</h2><p id="sub">Сундук с камушком ещё закрыт</p><button id="skip" type="button" style="margin-top:10px;background:transparent;color:white;border:0;font-weight:800">Хватит, покажи подарок</button></div>
  </div>
  <script src="chest.js"></script>
  <script>
    var pear = document.getElementById("pear");
    var chest = document.getElementById("chest");
    var card = document.getElementById("card");
    var title = document.getElementById("title");
    var sub = document.getElementById("sub");
    var ring = document.getElementById("ring");
    var bits = [];
    for (var i = 0; i < 14; i++) {
      var b = document.createElement("i");
      b.className = "burst" + (i % 2 ? " g" : "");
      document.getElementById("scene").appendChild(b);
      bits.push(b);
    }
    var cheer = "../../../public/mascot/art/cheer.webp";
    var goal = "../../../public/mascot/art/goal.webp";
    var autumn = "../../../public/mascot/art/autumn/cheer.webp";

    function pose(name) {
      chest.classList.remove("pose-shut", "pose-crack", "pose-open");
      chest.classList.add("pose-" + name);
    }
    function apply(ms) {
      pose("shut");
      card.classList.remove("show");
      pear.style.transform = "translateY(0)";
      ring.style.borderColor = "transparent";
      ring.style.transform = "scale(1)";
      bits.forEach(function (b) { b.style.opacity = "0"; });
      if (ms < 700) {
        pear.src = goal;
        title.textContent = "Я замерла";
        sub.textContent = "Сундук с камушком. Крышка закрыта.";
        pear.style.transform = "translateY(" + Math.sin(ms / 140) * 4 + "px)";
      } else if (ms < 1500) {
        pear.src = cheer;
        pose("shut");
        title.textContent = "Ой";
        sub.textContent = "Сундук качнулся";
        chest.style.transform = "scale(1.45) rotate(" + Math.sin(ms / 40) * 6 + "deg)";
      } else if (ms < 2400) {
        pear.src = cheer;
        pose("crack");
        chest.style.transform = "scale(1.45) rotate(-8deg)";
        title.textContent = "Ой";
        sub.textContent = "Из-под крышки тёплый свет";
      } else if (ms < 3800) {
        pear.src = cheer;
        pose("open");
        chest.style.transform = "scale(1.45)";
        title.textContent = "Смотри";
        sub.textContent = "Свет и листья. Секрет ещё внутри";
        var k = (ms - 2400) / 1400;
        ring.style.borderColor = "rgba(255,236,180,.85)";
        ring.style.transform = "scale(" + (1 + k * 6) + ")";
        ring.style.opacity = String(1 - k);
        bits.forEach(function (b, i) {
          var ang = (i / bits.length) * Math.PI * 2;
          var dist = 40 + k * 150;
          b.style.opacity = String(1 - k * 0.3);
          b.style.transform = "translate(" + Math.cos(ang) * dist + "px," + Math.sin(ang) * dist + "px) rotate(" + (k * 180) + "deg)";
        });
      } else {
        pear.src = autumn;
        pose("open");
        chest.style.transform = "scale(1.15) translate(-20px, 30px)";
        card.classList.add("show");
        title.textContent = "Золотой лист";
        sub.textContent = "Хочешь, надену?";
        bits.forEach(function (b, i) {
          var ang = (i / bits.length) * Math.PI * 2;
          b.style.opacity = "0.8";
          b.style.transform = "translate(" + Math.cos(ang) * 160 + "px," + (Math.sin(ang) * 120 - 20) + "px) rotate(40deg)";
        });
      }
    }
    var params = new URLSearchParams(location.search);
    var forced = params.has("t") ? Number(params.get("t")) || 0 : null;
    document.getElementById("skip").addEventListener("click", function () {
      forced = 5000;
      apply(5000);
    });
    if (forced != null) {
      apply(forced);
    } else {
      var start = performance.now();
      function loop(now) {
        if (forced != null) return;
        var ms = (now - start) % 6200;
        apply(ms);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
