<!doctype html>
<html lang="ru">
<head>

<body>
  <div class="phone">
    <header class="top"><h1>Сегодня</h1></header>
    <p class="date">воскресенье, 22 ноября</p>
    <div class="scroll">

      <section class="day-card" aria-label="Сейчас">
        <div class="day-head">
          <div class="day-copy">
            <p class="day-eye">Сейчас · день</p>
            <p class="day-title"><span>Осталось 458</span><span class="rest">из 2 100 ккал</span></p>
          </div>
          <img class="mascot" src="../../../public/mascot/art/autumn/idle.webp" alt="" />

        <div class="kcal-scale" aria-hidden="true"><i style="width:78%"></i></div>
        <div class="macros">
          <div class="macro"><b>Белки</b><i><span style="width:66%;background:#0d7377"></span></i><em>92 из 140 г</em></div>

          <div class="macro"><b>Углеводы</b><i><span style="width:73%;background:#0891b2"></span></i><em>168 из 230 г</em></div>
        </div>
        <div class="water-chip">
          <div><b>Вода</b><span>1,2 из 2,0 л</span></div>
          <button type="button">Стакан</button>
        </div>
      </section>
<button class="chest-strip" type="button">
        <span class="mini-chest " aria-hidden="true"><i class="lid"></i><i class="box"></i><i class="gem"></i></span>
        <span>
          <p>Пока пусто. Завтрак или зал — и первый листок.</p>
          <span class="leafs"><span class="lf "><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path class="blade" d="M12 2c4 6 8 8 8 13a8 8 0 0 1-16 0c0-5 4-7 8-13z"/><path d="M12 9v10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><small>пт</small></span><span class="lf "><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path class="blade" d="M12 2c4 6 8 8 8 13a8 8 0 0 1-16 0c0-5 4-7 8-13z"/><path d="M12 9v10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><small>сб</small></span><span class="lf wait"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path class="blade" d="M12 2c4 6 8 8 8 13a8 8 0 0 1-16 0c0-5 4-7 8-13z"/><path d="M12 9v10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><small>вс</small></span></span>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <article class="meal"><div><span>Завтрак</span><b>Сырники со сметаной</b></div><em>420</em></article>
      <article class="meal"><div><span>Обед</span><b>Курица с киноа</b></div><em>610</em></article>

    </div>
    <div class="composer"><span style="flex:1">Записать еду</span><span class="cam">◉</span><span class="plus">+</span></div>
    <nav class="tabs"><div class="tab on">Сегодня</div><div class="tab">Зал</div><div class="tab">Прогресс</div><div class="tab">Я</div></nav>
  </div>
  <script src="chest.js"></script>
