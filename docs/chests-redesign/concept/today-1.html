<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>1 из 3</title>
  <link rel="stylesheet" href="../screens.css" />
  <link rel="stylesheet" href="rich.css" />
</head>
<body>
  <div class="phone">
    <header class="top"><h1>Сегодня</h1></header>
    <p class="date">воскресенье, 22 ноября</p>
    <div class="scroll">

      <section class="day-card" aria-label="Сейчас">
        <div class="day-head">
          <div class="day-copy">
            <p class="day-eye">Сейчас · день</p>
            <p class="day-title"><span>Осталось 458</span><span class="rest">из 2 100 ккал</span></p>
          </div>
          <img class="mascot" src="../../../public/mascot/art/autumn/idle.webp" alt="" />
        </div>
        <div class="kcal-scale" aria-hidden="true"><i style="width:78%"></i></div>
        <div class="macros">
          <div class="macro"><b>Белки</b><i><span style="width:66%;background:#0d7377"></span></i><em>92 из 140 г</em></div>
          <div class="macro"><b>Жиры</b><i><span style="width:77%;background:#d97706"></span></i><em>54 из 70 г</em></div>
          <div class="macro"><b>Углеводы</b><i><span style="width:73%;background:#0891b2"></span></i><em>168 из 230 г</em></div>
        </div>
        <div class="water-chip">
          <div><b>Вода</b><span>1,2 из 2,0 л</span></div>
          <button type="button">Стакан</button>
        </div>
      </section>
<button class="chest-strip" type="button">
        <span class="mini-chest " aria-hidden="true"><i class="lid"></i><i class="box"></i><i class="gem"></i></span>
        <span>
          <p>В пятницу был завтрак. Ещё два дня.</p>
          <span class="leafs"><span class="lf on"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path class="blade" style="fill:#0d7377;stroke:none" d="M13.2 2.2 18.2 7.6 19.4 13.8 14.6 18.2 11.4 17.2 7.2 12.8 8.4 6.2Z"/><path d="M12.2 17.4 9.2 22.6" fill="none" stroke="#e8f7f4" stroke-width="2" stroke-linecap="round"/><path d="M12.4 16.2 14.2 4.2" fill="none" stroke="#d5f3ee" stroke-width="1.5" stroke-linecap="round"/></svg><small>пт</small></span><span class="lf "><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path class="blade" style="fill:none;stroke:#7d9c98;stroke-width:1.5;stroke-linejoin:round" d="M13.2 2.2 18.2 7.6 19.4 13.8 14.6 18.2 11.4 17.2 7.2 12.8 8.4 6.2Z"/><path d="M12.2 17.4 9.2 22.6" fill="none" stroke="#7d9c98" stroke-width="2" stroke-linecap="round"/><path d="M12.4 16.2 14.2 4.2" fill="none" stroke="#7d9c98" stroke-width="1.4" stroke-linecap="round"/></svg><small>сб</small></span><span class="lf "><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path class="blade" style="fill:none;stroke:#7d9c98;stroke-width:1.5;stroke-linejoin:round" d="M13.2 2.2 18.2 7.6 19.4 13.8 14.6 18.2 11.4 17.2 7.2 12.8 8.4 6.2Z"/><path d="M12.2 17.4 9.2 22.6" fill="none" stroke="#7d9c98" stroke-width="2" stroke-linecap="round"/><path d="M12.4 16.2 14.2 4.2" fill="none" stroke="#7d9c98" stroke-width="1.4" stroke-linecap="round"/></svg><small>вс</small></span></span>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <article class="meal"><div><span>Завтрак</span><b>Сырники со сметаной</b></div><em>420</em></article>
      <article class="meal"><div><span>Обед</span><b>Курица с киноа</b></div><em>610</em></article>

    </div>
    <div class="composer"><span style="flex:1">Записать еду</span><span class="cam">◉</span><span class="plus">+</span></div>
    <nav class="tabs"><div class="tab on">Сегодня</div><div class="tab">Зал</div><div class="tab">Прогресс</div><div class="tab">Я</div></nav>
  </div>
  <script src="chest.js"></script>
</body>
</html>
