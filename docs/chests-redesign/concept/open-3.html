<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Кадр 3</title>
  <link rel="stylesheet" href="../screens.css" />
  <link rel="stylesheet" href="rich.css" />
</head>
<body>
  <div class="stage rich">
    <p class="frame-note" style="position:absolute;top:28px">Кадр 3 · вспышка</p>

    <i class="mote gold" style="left:300px;top:150px"></i>
    <i class="mote" style="left:60px;top:80px"></i>
    <i class="mote gold" style="left:250px;top:90px;transform:rotate(80deg)"></i>
    <i class="mote" style="left:180px;top:70px"></i>
    <span class="pill rare" style="position:relative;z-index:2">Редкий</span>
    <img src="../../../public/mascot/art/cheer.webp" alt="" style="width:200px;height:190px;object-fit:contain;position:relative;z-index:2" />
    <div data-chest="rare" data-pose="open" class="lg" style="margin-top:-20px;position:relative;z-index:2"></div>
    <h2 style="font-size:24px;position:relative">Смотри</h2>
    <p class="lead">Свет и листья. Что внутри — ещё секрет.</p>
  </div>
  <script src="chest.js"></script>

</html>
