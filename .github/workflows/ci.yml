name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:client-imports
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Recognition eval suite
        run: npm run test:recognition-eval
      - name: Cron dry-run invariant (#49)
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { readFileSync } from 'node:fs';
            const src = readFileSync('src/app/api/cron/reminders/route.ts','utf8');
            assert.match(src, /dryRun/);
            assert.match(src, /get\\(\\\"dryRun\\\"\\)/);
            console.log('cron dryRun param present');
          "

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-secret-for-build
          AUTH_SECRET: ci-secret-for-build
          DATABASE_URL: "mysql://user:pass@127.0.0.1:3306/ci"
          SKIP_ENV_VALIDATION: "1"

  playwright-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and smoke test
        run: |
          npm run build
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health/ >/dev/null \
               || curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health/ || curl -sf http://127.0.0.1:3000/api/health
          npx playwright test
        env:
          NEXTAUTH_SECRET: ci-secret-for-build
          AUTH_SECRET: ci-secret-for-build
          DATABASE_URL: "mysql://user:pass@127.0.0.1:3306/ci"
          SKIP_ENV_VALIDATION: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
