<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <title>Calorie Vision</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f766e;
        color: #ecfdf5;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .box {
        text-align: center;
        padding: 2rem;
      }
      .box p {
        opacity: 0.9;
        font-size: 0.95rem;
      }
    </style>
    <script>
      // Fallback shell if server.url is unavailable at build/sync time.
      // In production Capacitor loads https://calorievision.ru via capacitor.config.ts.
      if (typeof window !== "undefined" && !window.Capacitor) {
        location.replace("https://calorievision.ru/ration");
      }
    </script>
  </head>
  <body>
    <div class="box">
      <strong>Calorie Vision</strong>
      <p>Открываем дневник…</p>
    </div>
  </body>
</html>
